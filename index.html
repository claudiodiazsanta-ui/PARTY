/* ===================== TABLERO (5 lóbulos circulares unidos por 5 conos, como el Party original) ===================== */
const NODES=[],NB=[],EDGES=[],SP=[];
let START=-1,VW=700,VH=700,CX=350,CY=350,LOBES=[];
const PCAT=['m','q','l','p','d'];
(function(){
 const RJ=190,RP=125,RE=185,TR=Math.PI/180;
 const th=[0,1,2,3,4].map(k=>-90+72*k);
 const pol=(r,d)=>[r*Math.cos(d*TR),r*Math.sin(d*TR)];
 const raw=[],id={};
 const add=(key,p,kind)=>{id[key]=raw.length;raw.push({x:p[0],y:p[1],kind:kind||'ring'})};
 const J=th.map(t=>pol(RJ,t)),P=th.map(t=>pol(RP,t));
 for(let k=0;k<5;k++){add('J'+k,J[k]);add('P'+k,P[k],'trophy')}
 let pitch=0;
 for(let k=0;k<5;k++){
  const E=pol(RE,th[k]+36),Jn=J[(k+1)%5],A0=Math.atan2(J[k][1]-E[1],J[k][0]-E[0]),A1=Math.atan2(Jn[1]-E[1],Jn[0]-E[0]);
  const rho=Math.hypot(J[k][0]-E[0],J[k][1]-E[1]),mid=(th[k]+36)*TR,TP=2*Math.PI;
  const d=((A1-A0)%TP+TP)%TP,m=((mid-A0)%TP+TP)%TP;
  const delta=m<d?d:d-TP;
  LOBES.push({x:E[0],y:E[1],r:rho});
  for(let i=1;i<=5;i++){const a=A0+delta*i/6;add('a'+k+'_'+i,[E[0]+rho*Math.cos(a),E[1]+rho*Math.sin(a)])}
  pitch=2*rho*Math.sin(Math.abs(delta)/12);
 }
 const len=c=>{let s=0;for(let i=0;i<c.length-1;i++)s+=Math.hypot(c[i+1][0]-c[i][0],c[i+1][1]-c[i][1]);return s};
 const bez=(A,B,h,dv)=>{const Q=[(A[0]+B[0])/2+dv[0]*h,(A[1]+B[1])/2+dv[1]*h],o=[];for(let i=0;i<=400;i++){const t=i/400;o.push([(1-t)*(1-t)*A[0]+2*(1-t)*t*Q[0]+t*t*B[0],(1-t)*(1-t)*A[1]+2*(1-t)*t*Q[1]+t*t*B[1]])}return o};
 for(let k=0;k<5;k++){
  const k2=(k+1)%5,A=[raw[id['a'+k+'_4']].x,raw[id['a'+k+'_4']].y],B=[raw[id['a'+k2+'_2']].x,raw[id['a'+k2+'_2']].y],dv=pol(1,th[k2]);
  let lo=0,hi=400;for(let q=0;q<40;q++){const h=(lo+hi)/2;if(len(bez(A,B,h,dv))<4*pitch)lo=h;else hi=h}
  const c=bez(A,B,(lo+hi)/2,dv),cum=[0];for(let i=0;i<400;i++)cum.push(cum[i]+Math.hypot(c[i+1][0]-c[i][0],c[i+1][1]-c[i][1]));
  for(let j=1;j<=3;j++){const t=cum[400]*j/4;let ix=0;while(cum[ix]<t)ix++;add('b'+k+'_'+j,c[ix])}
 }
 let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
 raw.forEach(p=>{x0=Math.min(x0,p.x);x1=Math.max(x1,p.x);y0=Math.min(y0,p.y);y1=Math.max(y1,p.y)});
 const PAD=46;VW=Math.round(x1-x0+PAD*2);VH=Math.round(y1-y0+PAD*2);CX=PAD-x0;CY=PAD-y0;
 raw.forEach((p,i)=>{NODES.push({id:i,x:+(p.x+CX).toFixed(1),y:+(p.y+CY).toFixed(1),kind:p.kind,cat:null});NB.push([])});
 LOBES.forEach(l=>{l.x+=CX;l.y+=CY});
 const edge=(a,b)=>{const i=id[a],j=id[b];NB[i].push(j);NB[j].push(i);EDGES.push([i,j])};
 for(let k=0;k<5;k++){
  const k2=(k+1)%5;edge('J'+k,'P'+k);
  const ch=['J'+k,'a'+k+'_1','a'+k+'_2','a'+k+'_3','a'+k+'_4','a'+k+'_5','J'+k2];
  for(let i=0;i<ch.length-1;i++)edge(ch[i],ch[i+1]);
  const br=['a'+k+'_4','b'+k+'_1','b'+k+'_2','b'+k+'_3','a'+k2+'_2'];
  for(let i=0;i<br.length-1;i++)edge(br[i],br[i+1]);
  NODES[id['P'+k]].cat=PCAT[k];NODES[id['P'+k]].spur=k;
  SP.push({junc:id['J'+k],nodes:[id['P'+k]],cat:PCAT[k]});
 }
 const SEQ={J:['d','m','q','l','p'],
  a:[['l','m','F','p','l'],['p','q','F','d','p'],['d','l','F','m','d'],['m','p','F','q','m'],['q','d','F','l','q']],
  b:[['d','F','d'],['m','F','m'],['q','F','q'],['l','F','l'],['p','F','p']]};
 const setc=(key,c)=>{const n=NODES[id[key]];if(c==='F'){n.cat='free';n.kind='free'}else n.cat=c};
 for(let k=0;k<5;k++){
  setc('J'+k,SEQ.J[k]);
  SEQ.a[k].forEach((c,i)=>setc('a'+k+'_'+(i+1),c));
  SEQ.b[k].forEach((c,i)=>setc('b'+k+'_'+(i+1),c));
 }
 START=id['a2_3'];
})();
const pent=(x,y,r)=>[0,1,2,3,4].map(k=>{const a=(-90+72*k)*Math.PI/180;return (x+r*Math.cos(a)).toFixed(1)+','+(y+r*Math.sin(a)).toFixed(1)}).join(' ');
function boardSVG(){

 NODES.forEach(n=>{

 });
 return `<g>${em}</g><circle cx="${CX}" cy="${CY}" r="46" fill="rgba(255,255,255,.1)" stroke="rgba(255,255,255,.3)" stroke-width="3"/>

}

function tone(f,d=.12,type='sine',v=.15,delay=0){const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;const t=a.currentTime+delay;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02)}
const sfx={tick:()=>tone(520,.06,'square',.05),roll:()=>[0,1,2,3,4].forEach(i=>tone(300+i*40,.05,'square',.05,i*.08)),

 beep:()=>tone(880,.1,'square',.1),go:()=>[660,880].forEach((f,i)=>tone(f,.12,'triangle',.18,i*.1)),buzz:()=>{tone(180,.7,'sawtooth',.22);tone(140,.7,'square',.12,.05)},win:()=>[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,.2,'triangle',.2,i*.12))};

/* ===================== RED: cliente MQTT mínimo sobre WebSocket ===================== */
const BROKERS=(()=>{let q=null;try{q=new URLSearchParams(location.search).get('broker')}catch(e){}return q?[q]:['wss://broker.hivemq.com:8884/mqtt','wss://broker.emqx.io:8084/mqtt']})();
function MQ(urls,cid,cb){
 const enc=new TextEncoder(),dec=new TextDecoder();
 let ws=null,buf=new Uint8Array(0),ui=0,closed=false,ping=null,conT=null,rt=null,subs=[],ok=false,pid=0;
 const str=s=>{const b=enc.encode(s);const o=new Uint8Array(2+b.length);o[0]=b.length>>8;o[1]=b.length&255;o.set(b,2);return o};
 const cat=(...a)=>{const n=a.reduce((s,x)=>s+x.length,0);const o=new Uint8Array(n);let p=0;a.forEach(x=>{o.set(x,p);p+=x.length});return o};
 const vl=n=>{const o=[];do{let d=n%128;n=Math.floor(n/128);if(n>0)d|=128;o.push(d)}while(n>0);return Uint8Array.from(o)};
 const pkt=(h,body)=>cat(Uint8Array.of(h),vl(body.length),body);
 const send=u=>{try{if(ws&&ws.readyState===1){ws.send(u);return true}}catch(e){}return false};
 function sendSub(list){pid=(pid%65534)+1;send(pkt(0x82,cat(Uint8Array.of(pid>>8,pid&255),...list.map(t=>cat(str(t),Uint8Array.of(0))))))}
 function handle(h,b){
  const t=h>>4;
  if(t===2){
   if(b[1]===0){ok=true;clearTimeout(conT);clearInterval(ping);ping=setInterval(()=>send(Uint8Array.of(0xC0,0)),20000);if(subs.length)sendSub(subs);cb.status&&cb.status(true,urls[ui%urls.length])}
   else{try{ws.close()}catch(e){}}
  }else if(t===3){
   const qos=(h>>1)&3;const tl=(b[0]<<8)|b[1];const topic=dec.decode(b.slice(2,2+tl));let off=2+tl;
   if(qos>0){const id=(b[off]<<8)|b[off+1];off+=2;send(Uint8Array.of(0x40,2,id>>8,id&255))}
   cb.msg&&cb.msg(topic,dec.decode(b.slice(off)));
  }
 }
 function parse(){
  for(;;){
   if(buf.length<2)return;
   let rl=0,m=1,i=1,x;
   for(;;){if(i>=buf.length)return;x=buf[i++];rl+=(x&127)*m;m*=128;if(!(x&128))break;if(i>5){try{ws.close()}catch(e){}return}}
   if(buf.length<i+rl)return;
   const h=buf[0],body=buf.slice(i,i+rl);buf=buf.slice(i+rl);handle(h,body);
  }
 }
 function open(){
  if(closed)return;
  const url=urls[ui%urls.length];
  try{ws=new WebSocket(url,'mqtt')}catch(e){ui++;rt=setTimeout(open,1500);return}
  const mine=ws;ws.binaryType='arraybuffer';buf=new Uint8Array(0);ok=false;
  conT=setTimeout(()=>{try{mine.close()}catch(e){}},7000);
  ws.onopen=()=>send(pkt(0x10,cat(str('MQTT'),Uint8Array.of(4,2,0,30),str(cid))));
  ws.onmessage=e=>{if(mine!==ws)return;buf=cat(buf,new Uint8Array(e.data));parse()};
  ws.onclose=()=>{if(mine!==ws)return;clearTimeout(conT);clearInterval(ping);const was=ok;ok=false;cb.status&&cb.status(false);if(!closed){if(!was)ui++;rt=setTimeout(open,was?800:1500)}};
  ws.onerror=()=>{};
 }
 open();
 return{
  sub(topics){topics.forEach(t=>{if(!subs.includes(t))subs.push(t)});if(ok)sendSub(topics)},
  pub(topic,payload,retain){if(!ok)return false;return send(pkt(0x30|(retain?1:0),cat(str(topic),enc.encode(payload))))},
  get ok(){return ok},
  close(){closed=true;clearTimeout(rt);clearTimeout(conT);clearInterval(ping);try{ws&&ws.close()}catch(e){}}
 };
}
const NET={mq:null,room:null,up:false,
 start(room){
  this.stop();this.room=room;
  const cid='pf'+ME.id+'_'+Math.random().toString(36).slice(2,6);
  this.mq=MQ(BROKERS,cid,{
   status:(up)=>{NET.up=up;paintNet();if(up&&ME.host&&G&&G.room===NET.room)NET.pub('s',JSON.stringify(G),true);if(up&&!ME.host)intent({t:'hello'})},
   msg:(t,p)=>NET.onMsg(t,p)});
  this.mq.sub([`pfam1/${room}/s`,`pfam1/${room}/h`,`pfam1/${room}/d`,`pfam1/${room}/p/${ME.id}`]);
 },
 stop(){if(this.mq)this.mq.close();this.mq=null;this.up=false;this.room=null;paintNet()},
 pub(sub,payload,retain){return this.mq?this.mq.pub(`pfam1/${this.room}/${sub}`,payload,retain):false},
 onMsg(topic,payload){
  const sub=topic.split('/').slice(2).join('/');let m=null;
  if(sub==='s'){
   if(!payload)return;try{m=JSON.parse(payload)}catch(e){return}onSnapshot(m);return;
  }
  try{m=JSON.parse(payload)}catch(e){return}
  if(sub==='h'){if(ME.host&&G&&m.from!==ME.id)hostHandle(m,m.from)}
  else if(sub==='d'){onDraw(m)}
  else if(sub.startsWith('p/')){handlePriv(m)}
 }};
function paintNet(){const el=$('#net');if(el)el.innerHTML=netHTML()}
function netHTML(){
 if(!G||!G.room)return '';
 return `<span class="dot ${NET.up?'on':''}"></span>${NET.up?'Online':'Conectando…'}`;
}

function validGame(g){
 try{return !!(g&&g.v===3&&Array.isArray(g.teams)&&g.teams.length>=2&&g.set&&g.claims&&typeof g.ph==='string'&&g.teams.every(t=>t.node>=0&&t.node<NODES.length&&Array.isArray(t.m)&&Array.isArray(t.tro))&&g.turn>=0&&g.turn<g.teams.length)}catch(e){return false}
}
function normalizeG(g){
 if(g.ph!=='lobby'&&g.ph!=='win'){g.ph='roll';g.mv=null;g.tr=null;g.ev=null;g.die=null;g.msg='Partida reanudada. Turno de '+g.teams[g.turn].name}
 return g;
}
function hostSave(){try{sset('pf3_host',JSON.stringify({G,used:H.used}))}catch(e){}}
function loadHostSave(){try{const x=JSON.parse(sget('pf3_host')||'null');if(x&&validGame(x.G))return x}catch(e){}return null}
function commit(){
 G.rev=(G.rev||0)+1;G.ts=Date.now();OFF=0;hostSave();
 if(G.room)NET.pub('s',JSON.stringify(G),true);
 route();
}
function onSnapshot(m){
 if(!validGame(m))return;
 if(ME.host&&G){
  if(m.host===ME.id)return;            // eco de mi propio estado
  if(m.room===G.room&&(m.rev||0)>(G.rev||0)){ME.host=false;toast('Otro dispositivo ha tomado el control');G=m;OFF=m.ts-Date.now();route();return}
  return;
 }
 if(G&&m.room===G.room&&m.host===G.host&&(m.rev||0)<=(G.rev||0))return;
 G=m;OFF=m.ts-Date.now();
 sset('pf3_sess',JSON.stringify({room:G.room,host:false}));
 route();
}
function handlePriv(m){

/* ---- asientos / permisos ---- */
const seatKey=(ti,mi)=>ti+':'+mi;
function claimant(ti,mi){const k=seatKey(ti,mi);for(const d in G.claims)if(G.claims[d].includes(k))return d;return null}
function mineSeat(ti,mi){const c=claimant(ti,mi);return c?c===ME.id:ME.host}
function teamMine(ti){return ME.host||G.teams[ti].m.some((_,i)=>claimant(ti,i)===ME.id)}
function deviceOfSeat(ti,mi){return claimant(ti,mi)||G.host}
function allowTeam(from,ti){return from===G.host||G.teams[ti].m.some((_,i)=>claimant(ti,i)===from)}
function isPerf(from,tr){const c=claimant(tr.ti,tr.perfMi);return c?c===from:from===G.host}
function isMate(from,tr){return G.teams[tr.ti].m.some((_,i)=>i!==tr.perfMi&&claimant(tr.ti,i)===from)}
const tIdx=k=>+String(k).split(':')[0];
function rivalDevs(ti){return Object.keys(G.claims).filter(d=>G.claims[d].some(k=>tIdx(k)!==ti)&&!G.claims[d].some(k=>tIdx(k)===ti))}
function isRival(d,ti){const r=rivalDevs(ti);return r.includes(d)||(d===G.host&&r.length===0)}
function hasRival(ti){return rivalDevs(ti).length>0}
function rivalMe(ti){return isRival(ME.id,ti)}
function claimWin(from){const tr=G.tr;if(isRival(from,tr.ti)||!hasRival(tr.ti))endTrial(true);else{clearTimeout(H.timer);tr.step='verify';commit()}}
function mySeatsText(){
 if(!G)return '';
 const out=[];G.teams.forEach((t,ti)=>t.m.forEach((m,mi)=>{if(claimant(ti,mi)===ME.id)out.push(m)}));
 if(out.length)return '🙋 '+out.join(', ');
 return ME.host?'👑 Anfitrión':'👀 Sin asiento';
}

/* ---- mazos (solo anfitrión) ---- */
const DECK={q:QUIZ,w:WORDS,s:SND,p:TABU,l:LABIOS,r:DRAW};
/* historial de elementos ya usados: persistente entre partidas (pf3_used) */
function loadUsed(){const e={q:[],w:[],s:[],p:[],l:[],r:[]};try{const x=JSON.parse(sget('pf3_used')||'null');if(x)for(const k in e)if(Array.isArray(x[k]))e[k]=x[k].filter(v=>typeof v==='string')}catch(err){}return e}
function saveUsed(){try{sset('pf3_used',JSON.stringify(H.used))}catch(e){}}
function mergeUsed(u){if(!u)return;for(const k in H.used)if(Array.isArray(u[k]))u[k].forEach(v=>{if(typeof v==='string'&&!H.used[k].includes(v))H.used[k].push(v)});saveUsed()}
function hid(d,it){const s=d==='q'?it[1]:d==='w'?it[0]+it[1]:d==='p'?it[0]:it;let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0).toString(36)}
function pool(deck){
 if(deck==='q')return QUIZ.map((x,i)=>G.set.tq.includes(x[0])?i:-1).filter(i=>i>=0);
 if(deck==='w')return WORDS.map((x,i)=>G.set.tw.includes(x[0])?i:-1).filter(i=>i>=0);
 return DECK[deck].map((_,i)=>i);
}
function draw(deck){
 const D=DECK[deck];let pl=pool(deck);if(!pl.length)pl=D.map((_,i)=>i);
 let used=H.used[deck]||(H.used[deck]=[]);
 const seen=new Set(used);
 let av=pl.filter(i=>!seen.has(hid(deck,D[i])));
 if(!av.length){const ids=new Set(pl.map(i=>hid(deck,D[i])));used=H.used[deck]=used.filter(x=>!ids.has(x));av=pl}
 const i=av[rnd(av.length)];used.push(hid(deck,D[i]));saveUsed();return D[i];
}
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
/* ¿la respuesta escrita coincide con la correcta o con algún alias? */
function qmatch(inp,ans,al){
 const x=norm(inp);if(!x)return false;
 const xt=x.split(' ');
 for(const raw of [ans].concat(al||[])){
  const c=norm(raw);if(!c)continue;
  if(x===c)return true;
  const ct=c.split(' ');
  if(xt.length<=ct.length+4)for(let i=0;i+ct.length<=xt.length;i++)if(xt.slice(i,i+ct.length).join(' ')===c)return true;
  if(c.length>=5&&/^[a-z ]+$/.test(c)&&Math.abs(x.length-c.length)<=2&&lev(x,c)<=(c.length>=9?2:1))return true;
 }
 return false;
}

/* ===================== MOTOR DEL ANFITRIÓN ===================== */
function newGameState(room){
 const teams=S.teams.map((t,i)=>({name:(t.name||'').trim()||('Equipo '+(i+1)),e:t.e,col:COLORS[i%COLORS.length],m:t.m.map((x,k)=>(x||'').trim()||('Jugador '+(i*2+k+1))),perf:0,node:START,tro:[]}));
 return{v:3,room:room||null,host:ME.id,rev:0,ts:Date.now(),teams,turn:0,winner:null,
  set:{time:S.time,meta:S.meta,dice2:S.dice2,tq:S.tq.length?S.tq.slice():Object.keys(THQ),tw:S.tw.length?S.tw.slice():Object.keys(THW)},
  claims:{},ph:room?'lobby':'roll',die:null,mv:null,tr:null,ev:null,msg:'',tseq:0};
}
function hostHandle(m,from){
 if(!G||!ME.host)return;
 const ph=G.ph,tr=G.tr;
 switch(m.t){
  case 'hello':if(G.room)NET.pub('s',JSON.stringify(G),true);break;
  case 'claim':{
   const mt=/^(\d+):(\d+)$/.exec(m.s||'');if(!mt)break;const ti=+mt[1],mi=+mt[2];
   if(!G.teams[ti]||G.teams[ti].m[mi]===undefined)break;
   const c=claimant(ti,mi);if(c&&c!==from){privateTo(from,{k:'toast',text:'Ese asiento ya está ocupado'});break}
   (G.claims[from]=G.claims[from]||[]);if(!G.claims[from].includes(m.s))G.claims[from].push(m.s);commit();break}
  case 'unclaim':{
   if(G.claims[from]){G.claims[from]=G.claims[from].filter(x=>x!==m.s);if(!G.claims[from].length)delete G.claims[from];commit()}break}
  case 'roll':if(ph==='roll'&&allowTeam(from,G.turn))doRoll();break;
  case 'choose':if(ph==='move'&&G.mv&&G.mv.opts&&allowTeam(from,G.mv.ti)&&G.mv.opts.includes(+m.n)&&H.chooseRes){const r=H.chooseRes;H.chooseRes=null;r(+m.n)}break;
  case 'pass':if(ph==='roll'&&allowTeam(from,G.turn)){G.msg='';nextTurn()}break;
  case 'needword':if(ph==='trial'&&tr&&tr.id===m.id&&H.sec.word!==undefined&&(deviceOfSeat(tr.ti,tr.perfMi)===from||isRival(from,tr.ti)))sendWord();break;
  case 'tword':if(ph==='trial'&&tr&&tr.step==='intro'&&(isPerf(from,tr)||from===G.host)){tr.step='word';commit()}break;
  case 'tchange':if(ph==='trial'&&tr&&tr.step==='word'&&!tr.changed&&(isPerf(from,tr)||from===G.host)){drawSecret(tr,true);tr.changed=true;commit();sendWord()}break;
  case 'tgo':if(ph==='trial'&&tr&&tr.step==='word'&&(isPerf(from,tr)||from===G.host)){
   tr.step='play';tr.endAt=Date.now()+G.set.time*1000;commit();
   clearTimeout(H.timer);const id=tr.id;H.timer=setTimeout(()=>{if(G.tr&&G.tr.id===id)endTrial(false,'time')},G.set.time*1000+400)}break;
  case 'tgood':if(ph==='trial'&&tr&&tr.step==='play'&&tr.cat!=='q'&&(isPerf(from,tr)||from===G.host||isRival(from,tr.ti)))claimWin(from);break;
  case 'tvok':if(ph==='trial'&&tr&&tr.step==='verify'&&isRival(from,tr.ti))endTrial(true);break;
  case 'tvno':if(ph==='trial'&&tr&&tr.step==='verify'&&isRival(from,tr.ti))endTrial(false,'cheat');break;
  case 'hskip':if(ph==='trial'&&tr&&tr.step!=='result'&&from===G.host)endTrial(false,'skip');break;
  case 'tgive':if(ph==='trial'&&tr&&tr.step==='play'&&(tr.cat==='q'?allowTeam(from,tr.ti):(isPerf(from,tr)||from===G.host)))endTrial(false,'give');break;
  case 'ttabu':if(ph==='trial'&&tr&&tr.step==='play'&&tr.cat!=='q'&&isRival(from,tr.ti))endTrial(false,tr.cat==='p'?'tabu':'cheat');break;
  case 'guess':if(ph==='trial'&&tr&&tr.step==='play'&&tr.cat!=='q'&&isMate(from,tr)){
   if(norm(m.x)&&norm(m.x)===norm(H.sec.word))claimWin(from);else privateTo(from,{k:'toast',text:'❌ Esa no es, ¡sigue probando!'})}break;
  case 'qstart':if(ph==='trial'&&tr&&tr.cat==='q'&&tr.step==='ready'&&isRival(from,tr.ti)){
   tr.step='play';tr.endAt=Date.now()+G.set.time*1000;commit();
   clearTimeout(H.timer);const id=tr.id;H.timer=setTimeout(()=>{if(G.tr&&G.tr.id===id)endTrial(false,'time')},G.set.time*1000+400)}break;
  case 'qstop':if(ph==='trial'&&tr&&tr.cat==='q'&&tr.step==='play'&&(allowTeam(from,tr.ti)||isRival(from,tr.ti))){
   clearTimeout(H.timer);tr.step='judge';commit()}break;
  case 'qok':if(ph==='trial'&&tr&&tr.cat==='q'&&tr.step==='judge'&&isRival(from,tr.ti))endTrial(true);break;
  case 'qno':if(ph==='trial'&&tr&&tr.cat==='q'&&tr.step==='judge'&&isRival(from,tr.ti))endTrial(false,'wrong');break;
  case 'tnext':if(ph==='trial'&&tr&&tr.step==='result'&&allowTeam(from,tr.ti))proceed();break;
  case 'rematch':if(from===G.host)rematch();break;
 }
}
async function doRoll(){
 if(H.busy)return;H.busy=true;
 try{
  const ti=G.turn;G.ph='rolling';G.die=null;G.msg='';commit();await sleep(900);
  const n=G.set.dice2?2:1;const v=Array.from({length:n},()=>1+rnd(6));const tot=v.reduce((a,b)=>a+b,0);
  G.die=v;G.ph='move';G.mv={ti,left:tot,cur:G.teams[ti].node,prev:null,opts:null};G.msg='Sacó '+tot;commit();await sleep(450);
  await stepLoop();
 }catch(e){console.error(e)}finally{H.busy=false}
}
async function stepLoop(){
 const mv=G.mv,ti=mv.ti,t=G.teams[ti];
 while(mv.left>0){
  let opts=NB[mv.cur].filter(n=>n!==mv.prev);
  if(!opts.length)opts=NB[mv.cur].slice();
  if(NODES[mv.cur].kind==='spur'&&mv.prev!==null&&!opts.includes(mv.prev))opts.push(mv.prev);
  let next;
  if(opts.length===1)next=opts[0];
  else{mv.opts=opts;commit();next=await new Promise(r=>{H.chooseRes=r});mv.opts=null}
  mv.prev=mv.cur;mv.cur=next;t.node=next;mv.left--;commit();await sleep(240);
  if(NODES[next].kind==='trophy'&&!t.tro.includes(NODES[next].cat))break;
 }
 G.mv=null;
 landing(ti);
}
function landing(ti){
 const t=G.teams[ti],node=NODES[t.node];
 if(node.kind==='free'){G.ph='roll';G.msg='🎲 Tirada libre: ¡tirad otra vez!';commit();return}
 if(node.kind==='start'){G.ph='roll';G.msg='Casilla de salida: ¡tirad otra vez!';commit();return}
 beginTrial(ti,node.cat,node.kind==='trophy'&&!t.tro.includes(node.cat));
}
function drawSecret(tr,keep){
 const cat=tr.cat;let dk;
 if(cat==='m'){if(!keep)tr.mode=Math.random()<.5?'mime':'sound';dk=tr.mode==='sound'?'s':'w';tr.label=tr.mode==='sound'?'Sonidos':'Mímica';tr.icon=tr.mode==='sound'?'🔊':'🎭'}
 else dk=cat==='p'?'p':cat==='l'?'l':cat==='d'?'r':'w';
 const it=draw(dk);
 H.sec.word=dk==='s'||dk==='l'||dk==='r'?it:dk==='p'?it[0]:it[1];
 H.sec.forb=dk==='p'?it[1]:null;
}
function beginTrial(ti,cat,fin){
 const t=G.teams[ti];const id=(G.tseq=(G.tseq||0)+1);
 const tr={id,ti,cat,fin,step:'intro',perfMi:t.perf%t.m.length,mode:null,label:CATS[cat].n,icon:CATS[cat].i,changed:false,endAt:0};
 H.sec={};
 if(cat==='q'){const it=draw('q');tr.q={th:it[0],text:it[1],ans:it[2]};
  tr.step='ready'}
 else drawSecret(tr,false);
 G.tr=tr;G.ph='trial';G.msg='';commit();
 if(cat!=='q')sendWord();
}
function sendWord(){
 const tr=G.tr;if(!tr)return;
 const to=new Set([deviceOfSeat(tr.ti,tr.perfMi)]);const r=rivalDevs(tr.ti);(r.length?r:[G.host]).forEach(d=>to.add(d));
 to.forEach(d=>privateTo(d,{k:'word',id:tr.id,word:H.sec.word,forb:H.sec.forb}));

function endTrial(ok,why){

let CV=null,drawBuf=[],drawTimer=null;
function redrawAll(c){
 const {ctx,w,h}=c;ctx.clearRect(0,0,w,h);
 for(const s of c.strokes){ctx.strokeStyle=s.c;ctx.lineWidth=s.w*w;ctx.beginPath();s.p.forEach(([x,y],i)=>i?ctx.lineTo(x*w,y*h):ctx.moveTo(x*w,y*h));if(s.p.length===1)ctx.lineTo(s.p[0][0]*w+.01,s.p[0][1]*h);ctx.stroke()}
}
function setupCanvas(){
 const cv=$('#cv');if(!cv)return null;
 const w=cv.clientWidth||300,h=Math.round(w*.72);cv.style.height=h+'px';
 const dpr=window.devicePixelRatio||1;cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);
 const ctx=cv.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);ctx.lineCap='round';ctx.lineJoin='round';
 return {cv,ctx,w,h,strokes:[],cur:null};
}
function flushDraw(){
 if(!drawBuf.length||!G||!G.tr)return;
 if(G.room)NET.pub('d',JSON.stringify({from:ME.id,id:G.tr.id,ops:drawBuf}));
 drawBuf=[];
}
function queueDraw(op){drawBuf.push(op);if(!drawTimer)drawTimer=setTimeout(()=>{drawTimer=null;flushDraw()},90)}
function initPerfCanvas(){
 const c=setupCanvas();if(!c)return;CV=c;
 let color='#111111';const SIZE=5/ c.w;
 const pos=e=>{const b=c.cv.getBoundingClientRect();return[(e.clientX-b.left)/b.width,(e.clientY-b.top)/b.height]};
 c.cv.onpointerdown=e=>{e.preventDefault();try{c.cv.setPointerCapture(e.pointerId)}catch(_){}
  const p=pos(e),w=color==='#ffffff'?22/c.w:SIZE;c.cur={c:color,w,p:[p]};c.strokes.push(c.cur);redrawAll(c);queueDraw(['b',color,+w.toFixed(4),+p[0].toFixed(4),+p[1].toFixed(4)])};
 c.cv.onpointermove=e=>{if(!c.cur)return;const a=c.cur.p[c.cur.p.length-1],b=pos(e);c.cur.p.push(b);
  c.ctx.strokeStyle=c.cur.c;c.ctx.lineWidth=c.cur.w*c.w;c.ctx.beginPath();c.ctx.moveTo(a[0]*c.w,a[1]*c.h);c.ctx.lineTo(b[0]*c.w,b[1]*c.h);c.ctx.stroke();
  queueDraw(['p',+b[0].toFixed(4),+b[1].toFixed(4)])};
 const up=()=>{c.cur=null;flushDraw()};c.cv.onpointerup=up;c.cv.onpointercancel=up;
 SHEET.querySelectorAll('.sw').forEach(b=>b.onclick=()=>{color=b.dataset.c;SHEET.querySelectorAll('.sw').forEach(x=>x.classList.remove('on'));b.classList.add('on')});
 const u=$('#undo'),x=$('#clr');
 if(u)u.onclick=()=>{c.strokes.pop();redrawAll(c);queueDraw(['u'])};
 if(x)x.onclick=()=>{c.strokes=[];redrawAll(c);queueDraw(['x'])};
}
function initViewCanvas(){const c=setupCanvas();if(c)CV=c}
function onDraw(m){
 if(!G||!G.tr||m.id!==G.tr.id||m.from===ME.id||!CV||CV.cv!==$('#cv'))return;
 for(const op of m.ops||[]){
  if(op[0]==='b'){CV.cur={c:op[1],w:op[2],p:[[op[3],op[4]]]};CV.strokes.push(CV.cur);redrawAll(CV)}
  else if(op[0]==='p'&&CV.cur){const a=CV.cur.p[CV.cur.p.length-1];CV.cur.p.push([op[1],op[2]]);
   CV.ctx.strokeStyle=CV.cur.c;CV.ctx.lineWidth=CV.cur.w*CV.w;CV.ctx.beginPath();CV.ctx.moveTo(a[0]*CV.w,a[1]*CV.h);CV.ctx.lineTo(op[1]*CV.w,op[2]*CV.h);CV.ctx.stroke()}
  else if(op[0]==='u'){CV.strokes.pop();CV.cur=null;redrawAll(CV)}
  else if(op[0]==='x'){CV.strokes=[];CV.cur=null;redrawAll(CV)}
 }
}

function rulesSheet(){
 return modal(`<div class="sh-h" style="background:#475569">📖 Cómo se juega</div><div class="sh-b">
 <p><b>Equipos:</b> se juega por parejas. Uno hace la prueba y su pareja adivina; en cada prueba de mímica, prohibidas, labios o dibujo se turnan.</p>
 <p><b>Objetivo:</b> ser el primer equipo en conseguir los trofeos 🏆 (3, 4 o 5, se elige al empezar).</p>
 <p><b>Tablero:</b> cinco círculos unidos. En cada cruce hay un «cono» hacia el centro que acaba en un premio dorado 🏆 (uno por prueba). Las casillas 🎲 son tirada libre.</p>
 <p><b>Turno:</b> tirad el dado y mueve la ficha paso a paso (al empezar, a derecha o izquierda; en cada cruce elegís el camino). Al terminar los pasos jugáis la prueba de la casilla. <b>Acertáis:</b> tiráis otra vez. <b>Falláis:</b> pasa el turno. También se puede pasar con ⏭️.</p>
 <p><b>Premios:</b> al llegar a un premio que aún no tenéis jugáis la <b>prueba final</b>. Si la superáis ganáis el trofeo y volvéis al cruce.</p>
 <div class="leg"><span style="background:#2563eb">❓ Preguntas</span><span style="background:#16a34a">🎭 Mímica y sonidos</span><span style="background:#f59e0b">🚫 Prohibidas</span><span style="background:#db2777">👄 Leer labios</span><span style="background:#9333ea">✏️ Dibujo</span></div>
 <p><b>⚖️ Quién hace qué:</b> el equipo que juega nunca lee la pregunta ni vigila. Los <b>rivales</b> (el otro equipo, o cualquiera de los otros) leen la pregunta o hacen de <b>juez</b>. Con 2 equipos, los dos miembros del equipo que no juega hacen de rivales.</p>
 <p><b>❓ Preguntas:</b> una sola respuesta, sin opciones. Un rival lee la pregunta en voz alta (él ve la respuesta correcta) y pulsa «Pregunta leída»: empieza la cuenta atrás (se ve en grande, avisa a los 10 s, pita los últimos 5 y suena al acabar). El equipo lo consulta y, cuando está de acuerdo, pulsa «Parar el tiempo» y dice <b>una única respuesta</b> en voz alta. El rival dice si es correcta ✅ o no ❌: si falla, se pierde la prueba. Si se acaba el tiempo o se rinden, también se pierde.</p>
 <p><b>🎭 Mímica y sonidos:</b> sale al azar una de las dos. <i>Mímica</i>: gestos, sin hablar ni sonidos. <i>Sonidos</i>: imitar con la voz (si es «pato», haz «cuac», pero no digas «pato»). Quien la hace ve la palabra en su móvil y su pareja adivina. Se puede cambiar la palabra una vez. El juez rival también ve la palabra y vigila; si hay trampa pulsa el botón rojo y se pierde.</p>
 <p><b>🚫 Palabras prohibidas:</b> describir la palabra sin decirla ni usar ninguna de las 5 prohibidas (tampoco derivados). Quien describe ve siempre la palabra y las prohibidas; el juez rival las ve también y pulsa «¡Ha dicho una palabra prohibida!» si se las salta.</p>
 <p><b>👄 Leer labios:</b> decir la palabra o frase moviendo solo los labios: sin voz y sin gestos. Su pareja la adivina y el juez vigila.</p>
 <p><b>✏️ Dibujo:</b> dibujar con el dedo, sin letras, números ni hablar. Su pareja lo ve en vivo y el juez también.</p>
 <p><b>Acertar:</b> cuando la pareja acierta, se pulsa «¡Adivinado!»: el tiempo se para y el juez confirma que fue sin trampas. Si no hay móviles de rivales, el anfitrión hace de juez y no hace falta confirmar.</p>
 <p><b>Sin repeticiones:</b> el juego recuerda las preguntas y palabras que ya han salido, también entre partidas distintas (en este mismo navegador). Solo se repiten cuando se acaba todo el banco. En Ajustes puedes ver cuántas lleva y olvidarlas.</p>
 <p><b>Cada uno en su móvil:</b> el anfitrión crea la sala y comparte el enlace. Cada jugador toca «Soy yo» en su nombre. El anfitrión actúa como árbitro y puede manejar a quien no tenga móvil.</p>
 <button class="btn" data-v="x">Entendido</button></div>`);
}

  else if(v&&v[0]==='t'&&v!=='t'&&hostOnly){G.set.time=+v.slice(1);commit()}
  else break;
  saveS();
 }
}
/* ---- JSON ---- */
function downloadGame(){
 try{
  const blob=new Blob([JSON.stringify({G,used:H.used},null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='party-familiar-partida.json';
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);toast('Partida descargada 💾');
 }catch(e){toast('No se pudo descargar. Usa «Copiar código».')}
}
function applyLoaded(x){
 const g=x&&x.G?x.G:x;
 if(!validGame(g)){toast('Archivo no válido');return false}
 leaveNet();
 g.host=ME.id;g.room=null;g.claims={};normalizeG(g);if(g.ph==='lobby')g.ph='roll';
 G=g;ME.host=true;mergeUsed(x&&x.used);PRIV=null;
 sdel('pf3_sess');commit();toast('Partida cargada ✅ (sin sala; puedes abrir una desde ☰)');return true;
}
function loadFile(){
 const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';
 inp.onchange=()=>{const f=inp.files&&inp.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{applyLoaded(JSON.parse(rd.result))}catch(e){toast('Archivo no válido')}};rd.readAsText(f)};
 inp.click();
}
async function codeSheet(){
 const code=btoa(unescape(encodeURIComponent(JSON.stringify({G,used:H.used}))));
 const v=await modal(`<div class="sh-h" style="background:#475569">📋 Código de partida</div><div class="sh-b"><p>Copia este código y pégalo en «Pegar código» para continuar la partida en otro móvil.</p><textarea id="code" readonly>${code}</textarea><button class="btn" data-v="copy">Copiar</button><button class="btn sec" data-v="x">Cerrar</button></div>`);
 if(v==='copy')toast((await copyText(code))?'Código copiado ✅':'Selecciona el texto y cópialo a mano');
}
async function copyText(t){
 try{await navigator.clipboard.writeText(t);return true}catch(e){try{const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();return ok}catch(_){return false}}
}
async function pasteSheet(){
 const pr=modal(`<div class="sh-h" style="background:#475569">📥 Pegar código</div><div class="sh-b"><p>Pega aquí el código de una partida:</p><textarea id="code"></textarea><button class="btn" id="ldb">Cargar</button><button class="btn sec" data-v="x">Cancelar</button></div>`);
 let c='';$('#ldb').onclick=()=>{c=$('#code').value.trim();closeModal('load')};
 const v=await pr;
 if(v==='load'&&c){try{applyLoaded(JSON.parse(decodeURIComponent(escape(atob(c)))))}catch(e){toast('Código no válido')}}
}
async function seatsSheet(){
 for(;;){
  const v=await modal(`<div class="sh-h" style="background:#475569">🪑 Mis asientos</div><div class="sh-b"><p class="mini">Toca tu nombre para sentarte. Puedes ocupar más de un asiento (por ejemplo, una pareja con un solo móvil).</p>
  ${G.teams.map((t,ti)=>`<div class="card"><b>${esc(t.e+' '+t.name)}</b>${t.m.map((m,mi)=>{const c=claimant(ti,mi),mine=c===ME.id;return `<div class="seat"><span>👤 ${esc(m)}</span>${mine?`<button class="chip on" data-v="s:${seatKey(ti,mi)}">✔️ Soltar</button>`:c?'<span class="mini">📱 Ocupado</span>':`<button class="chip" data-v="s:${seatKey(ti,mi)}">🙋 Soy yo</button>`}</div>`}).join('')}</div>`).join('')}
  <button class="btn" data-v="x">Listo</button></div>`);
  if(v&&v.startsWith('s:')){const s=v.slice(2);const [ti,mi]=s.split(':').map(Number);intent({t:claimant(ti,mi)===ME.id?'unclaim':'claim',s});await sleep(250)}else break;
 }
}
async function roomSheet(){
 if(!G.room){
  if(!(await confirmBox('¿Abrir una sala online para que los demás se unan desde su móvil?')))return;
  openRoom();return;
 }
 const link=location.href.split('#')[0]+'#sala='+G.room;
 const v=await modal(`<div class="sh-h" style="background:#475569">🌐 Sala online</div><div class="sh-b"><div class="code">${esc(G.room)}</div><p class="mini" style="text-align:center">${NET.up?'🟢 Conectado':'🟠 Conectando…'}</p><textarea readonly style="height:60px">${esc(link)}</textarea><button class="btn" data-v="link">🔗 Copiar enlace</button><button class="btn sec" data-v="seats">🪑 Mis asientos</button>${ME.host?'<button class="btn bad" data-v="close">Cerrar la sala (seguir en un móvil)</button>':''}<button class="btn sec" data-v="x">Cerrar</button></div>`);
 if(v==='link')toast((await copyText(link))?'Enlace copiado ✅':'Selecciona el texto y cópialo a mano');
 else if(v==='seats')await seatsSheet();
 else if(v==='close'){if(await confirmBox('¿Cerrar la sala? Los demás móviles se desconectarán.'))closeRoom()}
}
async function menu(){
 const v=await modal(`<div class="sh-h" style="background:#475569">☰ Menú</div><div class="sh-b">
 <button class="btn sec" data-v="room">🌐 ${G.room?'Sala online':'Abrir sala online'}</button>
 ${G.room?'<button class="btn sec" data-v="seats">🪑 Mis asientos</button>':''}
 ${ME.host?`<button class="btn sec" data-v="dl">⬇️ Descargar partida (JSON)</button>
 <button class="btn sec" data-v="ld">📂 Cargar partida (JSON)</button>
 <button class="btn sec" data-v="copy">📋 Copiar código</button>
 <button class="btn sec" data-v="paste">📥 Pegar código</button>`:'<button class="btn sec" data-v="take">👑 Tomar el control (si el anfitrión se ha caído)</button>'}
 <button class="btn sec" data-v="set">⚙️ Ajustes</button>
 <button class="btn sec" data-v="rules">📖 Reglas</button>
 ${ME.host?`<button class="btn bad" data-v="reset">🔁 Empezar de nuevo (mismos equipos)</button>
 <button class="btn sec" data-v="new">🆕 Nueva partida</button>`:''}
 <button class="btn sec" data-v="home">🏠 ${ME.host?'Inicio (la partida queda guardada)':'Salir de la sala'}</button>
 <button class="btn" data-v="x">Cerrar</button></div>`);
 if(v==='room')await roomSheet();
 else if(v==='seats')await seatsSheet();
 else if(v==='dl')downloadGame();
 else if(v==='ld')loadFile();
 else if(v==='copy')await codeSheet();
 else if(v==='paste')await pasteSheet();
 else if(v==='take'){if(await confirmBox('¿Tomar el control de la partida? Solo si el anfitrión actual ya no está.'))takeOver()}
 else if(v==='set')await settingsSheet();
 else if(v==='rules')await rulesSheet();
 else if(v==='reset'){if(await confirmBox('¿Empezar de nuevo? Se borran trofeos y posiciones.'))rematch()}
 else if(v==='new'){if(await confirmBox('¿Empezar una partida nueva? La actual se perderá.')){endHosting();renderSetup()}}
 else if(v==='home'){if(ME.host){goHome()}else{leaveRoom()}}
}

/* ===================== SALAS ===================== */
function leaveNet(){clearTimeout(H.timer);NET.stop()}
function goHome(){leaveNet();G=null;ME.host=false;PRIV=null;renderHome()}
function endHosting(){
 if(G&&G.room)NET.pub('s','',true);
 leaveNet();{const old=sget('pf3_host');if(old)sset('pf3_prev',old)}sdel('pf3_host');sdel('pf3_sess');G=null;ME.host=false;PRIV=null;
}
function leaveRoom(){leaveNet();sdel('pf3_sess');G=null;ME.host=false;PRIV=null;renderHome()}
function openRoom(){
 G.room=genRoom();G.claims={};ME.host=true;
 sset('pf3_sess',JSON.stringify({room:G.room,host:true}));
 NET.start(G.room);commit();toast('Sala '+G.room+' abierta');setTimeout(()=>roomSheet(),400);
}
function closeRoom(){
 if(G.room)NET.pub('s','',true);
 leaveNet();G.room=null;G.claims={};sdel('pf3_sess');commit();
}
function takeOver(){
 if(!G)return;ME.host=true;G.host=ME.id;
 normalizeG(G);G.rev=(G.rev||0)+10;
 sset('pf3_sess',JSON.stringify({room:G.room,host:true}));commit();toast('Ahora eres el anfitrión 👑');
}
let joinTimer=null;
function joinRoom(code){
 code=(code||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
 if(code.length!==6){renderJoin(code,'El código tiene 6 letras o números.');return}
 leaveNet();G=null;ME.host=false;PRIV=null;
 screen='join';app.className='';closeSheet();
 app.innerHTML=`<div class="top"><button class="ib" data-act="home">←</button><b>Conectando…</b><span></span></div><div class="card" style="text-align:center"><div class="logo">📡</div><p>Entrando en la sala <b>${esc(code)}</b>…</p></div>`;
 NET.start(code);
 clearTimeout(joinTimer);
 joinTimer=setTimeout(()=>{if(!G){leaveNet();renderJoin(code,'No encuentro esa sala. Comprueba el código y que el anfitrión la tenga abierta. Si el problema continúa, puede que el servidor público esté caído: prueba en unos minutos.')}},9000);
}
function startHostSession(){
 // crea sala o partida local según el modo elegido
 saveS();ac();
 leaveNet();{const old=sget('pf3_host');if(old)sset('pf3_prev',old)}sdel('pf3_host');sdel('pf3_sess');PRIV=null;ME.host=true;
 if(S.mode==='online'){
  const room=genRoom();G=newGameState(room);G.msg='';
  sset('pf3_sess',JSON.stringify({room,host:true}));NET.start(room);
 }else{G=newGameState(null);G.msg='¡Empieza '+G.teams[0].name+'!'}
 commit();
}
function resumeHost(){
 const x=loadHostSave();if(!x)return;
 leaveNet();ME.host=true;G=normalizeG(x.G);G.host=ME.id;mergeUsed(x.used);PRIV=null;
 if(G.room)NET.start(G.room);
 commit();
}

/* ===================== EVENTOS ===================== */
const ACT={
 continue(){resumeHost()},
 rejoin(){let s=null;try{s=JSON.parse(sget('pf3_sess')||'null')}catch(e){}if(s&&s.room)joinRoom(s.room)},
 new(){renderSetup()},dice(){diceTool()},rules(){rulesSheet()},loadfile(){loadFile()},
 home(){leaveNet();clearTimeout(joinTimer);G=null;ME.host=false;renderHome()},
 joinscr(){renderJoin('')},
 join(){joinRoom(($('#jcode')||{}).value)},
 leave(){if(ME.host){goHome()}else leaveRoom()},
 mode(b){S.mode=b.dataset.n;saveS();renderSetup()},
 emoji(b){const i=+b.dataset.i;const used=S.teams.map(p=>p.e);let k=EMOJIS.indexOf(S.teams[i].e);for(let t=0;t<EMOJIS.length;t++){k=(k+1)%EMOJIS.length;if(!used.includes(EMOJIS[k]))break}S.teams[i].e=EMOJIS[k];saveS();renderSetup()},
 del(b){if(S.teams.length>2){S.teams.splice(+b.dataset.i,1);saveS();renderSetup()}else toast('Mínimo 2 equipos')},
 add(){if(S.teams.length>=6)return toast('Máximo 6 equipos');const n=S.teams.length,used=S.teams.map(p=>p.e);S.teams.push({name:'Equipo '+(n+1),e:EMOJIS.find(e=>!used.includes(e)),m:['Jugador '+(2*n+1),'Jugador '+(2*n+2)]});saveS();renderSetup()},
 third(b){const t=S.teams[+b.dataset.i];if(t.m.length>2)t.m.pop();else t.m.push('Jugador extra');saveS();renderSetup()},
 shuf(){S.teams=shuffle(S.teams);saveS();renderSetup()},
 meta(b){S.meta=+b.dataset.n;saveS();renderSetup()},
 time(b){S.time=+b.dataset.n;saveS();renderSetup()},
 d2(b){S.dice2=b.dataset.n==='1';saveS();renderSetup()},
 tq(b){const k=b.dataset.k;S.tq=S.tq.includes(k)?S.tq.filter(x=>x!==k):S.tq.concat(k);saveS();renderSetup()},
 tw(b){const k=b.dataset.k;S.tw=S.tw.includes(k)?S.tw.filter(x=>x!==k):S.tw.concat(k);saveS();renderSetup()},
 start:async()=>{if(loadHostSave()&&!(await confirmBox('Hay una partida guardada en este móvil. Si empiezas una nueva, quedará como «partida anterior» (puedes recuperarla desde el inicio). ¿Empezar una nueva?')))return;startHostSession()},
 restoreprev(){const v=sget('pf3_prev');if(v){sset('pf3_host',v);sdel('pf3_prev');toast('Partida recuperada ✅');renderHome()}},
 startonline(){if(!ME.host||!G)return;ac();G.ph='roll';G.msg='¡Empieza '+G.teams[0].name+'!';commit()},
 seat(b){const s=b.dataset.s;const [ti,mi]=s.split(':').map(Number);intent({t:claimant(ti,mi)===ME.id?'unclaim':'claim',s})},
 async copylink(){const l=location.href.split('#')[0]+'#sala='+G.room;toast((await copyText(l))?'Enlace copiado ✅':'No se pudo copiar')},
 async copycode(){toast((await copyText(G.room))?'Código copiado ✅':'No se pudo copiar')},
 roll(){ac();intent({t:'roll'})},
 async pass(){if(!G||G.ph!=='roll')return;if(await confirmBox('¿Pasar el turno al siguiente equipo?'))intent({t:'pass'})},
 menu(){menu()},rematch(){intent({t:'rematch'})},
 showwin(){winHidden=false;renderSheet()}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||MOD.classList.contains('on'))return;const f=ACT[b.dataset.act];if(f)f(b,e)});
document.addEventListener('input',e=>{const d=e.target.dataset;if(!d||d.ti===undefined)return;const t=S.teams[+d.ti];if(!t)return;if(d.mi!==undefined)t.m[+d.mi]=e.target.value;else t.name=e.target.value;saveS()});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target&&e.target.id==='jcode')joinRoom(e.target.value)});

/* ===================== ARRANQUE ===================== */
(function init(){
 let h='';try{h=location.hash||''}catch(e){}
 const m=/sala=([A-Za-z0-9]{6})/.exec(h);
 if(m){
  const code=m[1].toUpperCase();const hs=loadHostSave();
  if(hs&&hs.G.room===code){resumeHost();return}
  joinRoom(code);return;
 }
 renderHome();
})();
</script>
</body>
</html>
